<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> AYUB KHAN</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root{--red:#ff0033;--red2:#b00022;}
*{box-sizing:border-box;}

body{
margin:0;
color:white;
font-family:'Share Tech Mono',monospace;
display:flex;
justify-content:center;
min-height:100vh;
padding:20px;
background:black;
overflow:hidden;
}

#matrix,#radar{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
z-index:-1;
}

#radar{
background:
radial-gradient(circle at center, rgba(255,0,0,.15) 1px, transparent 1px),
repeating-radial-gradient(circle at center, transparent 0 20px, rgba(255,0,0,.05) 21px 22px);
animation:radar 4s linear infinite;
}

@keyframes radar{100%{transform:rotate(360deg)}}

.app-container{
width:100%;
max-width:420px;
z-index:2;
overflow-y:auto;
max-height:100vh;
padding-bottom:40px;
}

/* PROFILE / LOGO */
.logo-circle{
width:95px;
height:95px;
border-radius:50%;
border:2px solid var(--red);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 0 30px var(--red);
margin:20px auto;
background:black;
position:relative;
}

.logo-circle img{
width:75%;
height:75%;
object-fit:contain;
filter:drop-shadow(0 0 12px var(--red)) drop-shadow(0 0 25px var(--red));
}

.logo-circle::after{
content:'';
position:absolute;
top:-5px;left:-5px;right:-5px;bottom:-5px;
border-radius:50%;
border:1px solid rgba(255,0,0,0.2);
animation:pulseRing 2s infinite;
}

@keyframes pulseRing{
0%{transform:scale(1);opacity:0.5;}
100%{transform:scale(1.3);opacity:0;}
}

/* TITLE */
.title-box{text-align:center;margin-bottom:25px}
h1{font-family:'Orbitron';color:var(--red);font-size:1.7rem;letter-spacing:2px;}
.cursor{display:inline-block;width:8px;background:red;margin-left:4px;animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0}}
.subtitle{font-size:1.2rem}
.tagline{color:#aa0000;font-size:.8rem}

/* SEARCH CARD */
.search-card{
background:#050505;
border:1px solid var(--red);
padding:22px;
border-radius:12px;
box-shadow:0 0 25px rgba(255,0,0,.3);
}

input{
width:100%;
background:black;
border:1px solid var(--red);
padding:14px;
color:red;
font-size:1.1rem;
border-radius:6px;
}

input::placeholder{color:#660000}
input:focus{outline:none;box-shadow:0 0 10px red}

.btn-main{
margin-top:15px;
width:100%;
padding:14px;
background:linear-gradient(135deg,var(--red),#b00022);
border:none;
color:white;
font-weight:bold;
letter-spacing:2px;
border-radius:6px;
font-family:'Orbitron';
box-shadow:0 0 15px var(--red);
cursor:pointer;
}

/* LOADER / PROGRESS */
.loader{display:none;color:red;text-align:center;font-size:1.6rem;margin-top:15px}
.progress-box{
margin-top:15px;
border:1px solid red;
height:14px;
border-radius:10px;
overflow:hidden;
display:none;
}
.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,var(--red),#ff5c5c);
transition:width .2s;
}

/* RESULTS */
#results-area{margin-top:20px;display:none}
.data-card{
background:#050505;
border-left:4px solid var(--red);
border-radius:8px;
margin-bottom:15px;
animation:fade .3s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.dc-header{padding:10px;background:rgba(255,0,0,.15);color:red;font-weight:bold;display:flex;justify-content:space-between;}
.dc-body{padding:12px}
.dc-row{display:flex;justify-content:space-between;border-bottom:1px dashed #300;padding:5px 0;}
.lbl{color:#888}
.val{color:white;max-width:60%;text-align:right}

/* FOOTER */
.footer{text-align:center;margin-top:35px;color:#777;font-size:.8rem}
.brand-name{color:red;font-weight:bold;letter-spacing:2px;margin-top:5px}

/* WHATSAPP BUTTON - RED THEME */
.wa-btn{
display:flex;align-items:center;justify-content:center;
width:100%;margin-top:20px;padding:12px;background:linear-gradient(135deg,var(--red),#b00022);
border-radius:10px;color:#fff;text-decoration:none;font-weight:bold;transition:.2s;
}
.wa-btn i{margin-right:10px;color:white;}
.wa-btn:hover{opacity:0.9;}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div id="radar"></div>

<audio id="scanSound" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-fast-sci-fi-scan-1093.mp3"></audio>

<div class="app-container">

<!-- PROFILE / LOGO -->
<div class="logo-circle">
  <svg width="70" height="70" viewBox="0 0 24 24" fill="red" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 15px red);">
    <path d="M6,9.5V8.5c0-3.3,2.7-6,6-6s6,2.7,6,6v1H6z"/>
    <path d="M3,10c0-0.6,0.4-1,1-1h16c0.6,0,1,0.4,1,1s-0.4,1-1,1H4C3.4,11,3,10.6,3,10z"/>
    <path d="M12,12c-2,0-3.8,1.1-4.7,2.8c1.4,0.3,3,0.5,4.7,0.5s3.3-0.2,4.7-0.5C15.8,13.1,14,12,12,12z"/>
    <path d="M12,16.5c-2.5,0-5,0.5-7,1.5l-1,4h16l-1-4C17,17,14.5,16.5,12,16.5z"/>
    <path d="M7,16l-3,5h4.5L12,16L7,16z"/> <path d="M17,16l3,5h-4.5L12,16L17,16z"/> </svg>
</div>

<!-- WHATSAPP BUTTON (RED THEME) -->
<div class="whatsapp-section">
  <a href="https://whatsapp.com/channel/0029VbB5D3RAO7RBpzxkqh3L" target="_blank" class="wa-btn" style="background: linear-gradient(135deg,#ff0033,#b00022); border:none; color:white;">
    <i class="fab fa-whatsapp"></i>
    <span>WHATSAPP CHANNEL</span>
  </a>
</div>

<div class="title-box">
<h1 id="typeText"></h1><span class="cursor"></span>
<p class="subtitle">SIM DATABASE</p>
<p class="tagline">Encrypted Intelligence System</p>
</div>

<div class="search-card">
<input type="number" id="target" placeholder="ENTER NUMBER OR CNIC">
<button class="btn-main" onclick="fetchData()">SEARCH DATA</button>
<div class="progress-box" id="progressBox">
<div class="progress-bar" id="progressBar"></div>
</div>
</div>

<div id="loader" class="loader"><i class="fas fa-circle-notch fa-spin"></i></div>
<div id="results-area"></div>

<a href="https://whatsapp.com/channel/0029Vb6RX1XEQIal7mdufD2e" target="_blank" class="wa-btn">
<i class="fab fa-whatsapp"></i> WHATSAPP CHANNEL
</a>

<div class="footer">
<div>Professional Data Services</div>
<div class="brand-name">POWERED BY  AYUB KHAN</div>
</div>

</div>

<script>
/* MATRIX */
const c=document.getElementById("matrix"),x=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
const chars="01HACKERLEADERCIPHER$#@";
const size=14,cols=c.width/size;
const drops=Array(Math.floor(cols)).fill(1);
setInterval(()=>{
x.fillStyle="rgba(0,0,0,0.08)";
x.fillRect(0,0,c.width,c.height);
x.fillStyle="red";
x.font=size+"px monospace";
drops.forEach((y,i)=>{
const t=chars[Math.floor(Math.random()*chars.length)];
x.fillText(t,i*size,y*size);
if(y*size>c.height&&Math.random()>0.97)drops[i]=0;
drops[i]++;
});
},35);

/* TYPE EFFECT */
const txt=" LEADER CIPHER SYSTEM";let ti=0;
(function type(){if(ti<txt.length){
document.getElementById("typeText").innerHTML+=txt[ti++];
setTimeout(type,120)}})();

/* AI VOICE - BOY DANGEROUS HACKER */
function speak(){
speechSynthesis.cancel();
const msg=new SpeechSynthesisUtterance("Scanning target. Accessing encrypted database.");
msg.rate=0.85;
msg.pitch=0.6; // lower pitch for boy hacker style
msg.voice = speechSynthesis.getVoices().find(v => v.lang.includes('en') && v.name.toLowerCase().includes('male')) || null;
speechSynthesis.speak(msg);
}

/* API LOGIC */
const API_URL="https://sim.f-a-k.workers.dev/?q=";
const loader=document.getElementById("loader");
const resArea=document.getElementById("results-area");
const input=document.getElementById("target");
const bar=document.getElementById("progressBar");
const box=document.getElementById("progressBox");

async function fetchData(){
const query=input.value.trim();
if(query.length<3){alert("Enter valid number");return;}

document.getElementById("scanSound").play();
speak();

box.style.display="block";
bar.style.width="0%";

let p=0;
const loading=setInterval(()=>{p+=10;bar.style.width=p+"%";if(p>=100)clearInterval(loading);},120);

resArea.innerHTML='';resArea.style.display='block';loader.style.display='block';

try{
await new Promise(r=>setTimeout(r,1200));
const req=await fetch(API_URL+query);
const json=await req.json();
loader.style.display='none';

if(json.status==='success'){
renderCards(json.data);
}else{
resArea.innerHTML="<div style='color:red;text-align:center'>NO DATA FOUND</div>";
}
}catch{
loader.style.display='none';
resArea.innerHTML="<div style='color:red;text-align:center'>CONNECTION ERROR</div>";
}
}

function renderCards(data){
let records=Array.isArray(data)?data:[data];
let html='';
records.forEach((rec,i)=>{
html+=`<div class="data-card">
<div class="dc-header"><span>RECORD #${i+1}</span><span>VERIFIED</span></div>
<div class="dc-body">`;
for(const [k,v] of Object.entries(rec)){if(k==='response_code'||k==='credit'||k==='api_owner')continue;
html+=`<div class="dc-row"><span class="lbl">${k.toUpperCase()}</span><span class="val">${v}</span></div>`;}
html+=`</div></div>`;});
resArea.innerHTML=html;
}

input.addEventListener("keypress",e=>{if(e.key==="Enter")fetchData();});
</script>

</body>
</html>
